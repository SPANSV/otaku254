name: Refresh episodes
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-episodes.mjs
        env:
          YT_API_KEY: ${{ secrets.YOUTUBE_OTAKU254 }}
      - run: |
          git config user.name "otaku254-bot"
          git config user.email "otaku254-bot@users.noreply.github.com"
          git add episodes.json
          git diff --cached --quiet || git commit -m "Refresh episodes"
          git push
